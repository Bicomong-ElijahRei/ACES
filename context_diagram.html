<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACES Context Diagram (Level 0) – Gane & Sarson</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; background: #fff; }
        svg text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
</head>
<body>
<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
        </marker>
    </defs>

    <!-- ========== EXTERNAL ENTITIES (squares) ========== -->
    <!-- Student -->
    <rect x="30" y="80" width="100" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="80" y="110" text-anchor="middle" font-size="12" font-weight="bold">Student</text>

    <!-- Admin -->
    <rect x="870" y="80" width="100" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="920" y="110" text-anchor="middle" font-size="12" font-weight="bold">Admin</text>

    <!-- Staff (Lead) -->
    <rect x="870" y="200" width="100" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="920" y="222" text-anchor="middle" font-size="11" font-weight="bold">Staff</text>
    <text x="920" y="236" text-anchor="middle" font-size="9" font-weight="bold">(Lead)</text>

    <!-- ========== CENTRAL PROCESS ========== -->
    <rect x="330" y="150" width="320" height="100" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="190" x2="650" y2="190" stroke="#000" stroke-width="2"/>
    <text x="490" y="177" text-anchor="middle" font-size="13" font-weight="bold">0.0</text>
    <text x="490" y="215" text-anchor="middle" font-size="11">ACES Activity Tracking</text>
    <text x="490" y="230" text-anchor="middle" font-size="11">and Preregistration System</text>

    <!-- ======================== STUDENT ↔ SYSTEM ======================== -->
    <!-- Student → System (incoming) -->
    <polyline points="130,105 200,105 200,130 270,130" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="190" y="100" text-anchor="end" font-size="9">Login</text>

    <polyline points="130,115 210,115 210,145 270,145" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="195" y="110" text-anchor="end" font-size="9">Registration data</text>

    <polyline points="130,125 220,125 220,160 270,160" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="205" y="120" text-anchor="end" font-size="9">Subtopic selection</text>

    <polyline points="130,135 230,135 230,175 270,175" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="215" y="130" text-anchor="end" font-size="9">Quiz answers</text>

    <!-- System → Student (outgoing) -->
    <polyline points="330,210 250,210 250,145 130,145" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="280" y="205" text-anchor="start" font-size="9">Event listings</text>

    <polyline points="330,220 260,220 260,155 130,155" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="290" y="215" text-anchor="start" font-size="9">Registration confirmation</text>

    <polyline points="330,230 270,230 270,165 130,165" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="300" y="225" text-anchor="start" font-size="9">Attendance status</text>

    <polyline points="330,240 280,240 280,175 130,175" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="305" y="235" text-anchor="start" font-size="9">Module content, Progress</text>

    <!-- ======================== ADMIN ↔ SYSTEM ======================== -->
    <!-- Admin → System -->
    <polyline points="870,105 780,105 780,160 650,160" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="820" y="100" text-anchor="start" font-size="9">Session/subtopic data</text>

    <polyline points="870,115 770,115 770,175 650,175" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="810" y="110" text-anchor="start" font-size="9">Attendance records</text>

    <polyline points="870,125 760,125 760,190 650,190" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="800" y="120" text-anchor="start" font-size="9">Module content</text>

    <polyline points="870,135 750,135 750,205 650,205" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="790" y="130" text-anchor="start" font-size="9">Report requests</text>

    <!-- System → Admin -->
    <polyline points="650,220 760,220 760,145 870,145" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="810" y="215" text-anchor="end" font-size="9">Student records</text>

    <polyline points="650,230 770,230 770,155 870,155" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="815" y="225" text-anchor="end" font-size="9">Registration lists</text>

    <polyline points="650,240 780,240 780,165 870,165" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="825" y="235" text-anchor="end" font-size="9">Compliance reports</text>

    <polyline points="650,250 790,250 790,175 870,175" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="835" y="245" text-anchor="end" font-size="9">Export files</text>

    <!-- ======================== STAFF ↔ SYSTEM ======================== -->
    <!-- Staff → System -->
    <polyline points="870,225 780,225 780,280 650,280" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="820" y="220" text-anchor="start" font-size="9">Session/subtopic data</text>

    <polyline points="870,235 770,235 770,295 650,295" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="810" y="230" text-anchor="start" font-size="9">Attendance records</text>

    <polyline points="870,245 760,245 760,310 650,310" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="800" y="240" text-anchor="start" font-size="9">Module content</text>

    <polyline points="870,255 750,255 750,325 650,325" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="790" y="250" text-anchor="start" font-size="9">Report requests</text>

    <!-- System → Staff -->
    <polyline points="650,350 760,350 760,265 870,265" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="810" y="345" text-anchor="end" font-size="9">Student records</text>

    <polyline points="650,360 770,360 770,275 870,275" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="815" y="355" text-anchor="end" font-size="9">Registration lists</text>

    <polyline points="650,370 780,370 780,285 870,285" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="825" y="365" text-anchor="end" font-size="9">Compliance reports</text>

    <polyline points="650,380 790,380 790,295 870,295" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="835" y="375" text-anchor="end" font-size="9">Export files</text>

</svg>
</body>
</html>
